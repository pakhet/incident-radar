name: pipeline

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # weekly rebuild picks up base-image security patches
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pytest -q

  web:
    name: Build dashboard
    runs-on: ubuntu-latest
    permissions: { contents: read }
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 26, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build

  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  iac:
    name: IaC lint & scan
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - run: terraform fmt -check -recursive infra/terraform
      - run: terraform -chdir=infra/terraform init -backend=false && terraform -chdir=infra/terraform validate
      - name: Trivy misconfiguration scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { scan-type: config, scan-ref: ., severity: "HIGH,CRITICAL", exit-code: "1" }

  image:
    name: Container build, scan & smoke test
    runs-on: ubuntu-latest
    needs: [test, web]
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: docker build -t radar:ci .
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { image-ref: "radar:ci", severity: "HIGH,CRITICAL", ignore-unfixed: true, exit-code: "1" }
      - name: Smoke test (read-only root filesystem, no network for the app)
        run: |
          docker run -d --name radar --read-only --tmpfs /tmp -e RADAR_STORE=/tmp/data -p 8080:8080 radar:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          h=$(curl -fsSI http://127.0.0.1:8080/api/incidents); echo "$h"
          echo "$h" | grep -qi "^content-security-policy: default-src 'none'"
          ! echo "$h" | grep -qi '^server:'
          curl -fsS http://127.0.0.1:8080/ | grep -q 'Incident Radar'
          curl -fsS http://127.0.0.1:8080/feed.xml | grep -q '<feed'
          for p in how-it-works subscribe .well-known/security.txt; do curl -fsS "http://127.0.0.1:8080/$p" >/dev/null; done
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/api/incidents)" = 405
          docker exec radar id -u | grep -qx 10001

  deploy:
    name: Deploy to GCP
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test, web, secrets-scan, iac, image]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/incident-radar/radar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
      - name: Build & push
        id: push
        run: |
          tag="${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}-${GITHUB_RUN_NUMBER}"
          docker build -t "$IMAGE:$tag" .
          docker push "$IMAGE:$tag"
          echo "digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$tag")" >> "$GITHUB_OUTPUT"
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with: { image: "${{ steps.push.outputs.digest }}", format: spdx-json, output-file: sbom.spdx.json }
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign image & attest SBOM (keyless)
        run: |
          cosign sign --yes "${{ steps.push.outputs.digest }}"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${{ steps.push.outputs.digest }}"
      - name: Deploy web service
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3
        with:
          service: radar-web
          region: ${{ vars.GCP_REGION }}
          image: ${{ steps.push.outputs.digest }}
      - name: Update collector job
        run: gcloud run jobs update radar-collector --region "${{ vars.GCP_REGION }}" --image "${{ steps.push.outputs.digest }}" --quiet
      - name: Deploy Firebase Hosting config
        run: npx --yes firebase-tools@latest deploy --only hosting --project "${{ vars.GCP_PROJECT_ID }}" --non-interactive
