[project]
name = "radar"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rachel Coleman", email = "20465692+pakhet@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "feedparser>=6.0.14",
    "google-cloud-firestore>=2.34.1",
    "httpx>=0.28.1",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = ["S101", "SIM905"]  # asserts are fine; keep readable word lists

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning:starlette.testclient"]
